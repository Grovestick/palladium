<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grovestick Studios</title>
<meta name="description" content="Grovestick Studios.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='25' x='6' font-family='Georgia,serif' font-size='26' font-weight='700' fill='%234a90f0'>G</text></svg>">
<style>
/* the same ground and the same blue as Palladium: one studio, one look */
:root{
  --bg:#0d0f12; --fg:#e8ecf1; --dim:#93a0b0; --accent:#4a90f0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);overflow:hidden;
  font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
/* the studio's letter, drawn the way the program draws its own */
#watermark{position:fixed;inset:0;z-index:0;pointer-events:none;user-select:none;
  display:flex;align-items:center;justify-content:center;
  font:600 min(58vh,52vw)/1 Georgia,"Times New Roman",serif;
  color:var(--accent);opacity:.12}
footer{position:fixed;right:22px;bottom:18px;z-index:1;color:var(--dim);
  font-size:12px;letter-spacing:.14em;text-transform:uppercase}
@media (max-width:600px){footer{right:16px;bottom:14px;font-size:11px}}
</style>
</head>
<body>
  <div id="watermark" aria-hidden="true">G</div>
  <footer>Grovestick Studios</footer>
</body>
</html>
